[project]
name = "confluence-export-desktop"
version = "0.1.0"
description = "Windows-first Confluence Cloud to local Markdown export desktop app"
requires-python = ">=3.11"
dependencies = [
    "confluence-markdown-exporter==4.1.1",
    "pillow>=10",
    "PySide6>=6.8",
    "pystray>=0.19",
]

[project.scripts]
confluence-export-desktop = "confluence_sync_tool.gui:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
