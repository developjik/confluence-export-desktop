[project]
name = "confluence-sync-tool"
version = "0.1.0"
description = "Windows-first Confluence Cloud to local Markdown sync MVP"
requires-python = ">=3.11"
dependencies = [
    "confluence-markdown-exporter==4.1.1",
    "pillow>=10",
    "pystray>=0.19",
]

[project.scripts]
confluence-sync = "confluence_sync_tool.gui:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
