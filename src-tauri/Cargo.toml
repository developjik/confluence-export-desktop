[package]
name = "confluence-export-desktop"
version = "2.0.0"
description = "Confluence Export Desktop — direct Atlassian API exporter with a modern UI"
authors = ["developjik"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "confluence_export_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
scraper = "0.24"
ego-tree = "0.10"
url = "2"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
futures = "0.3"
once_cell = "1"
dirs = "6"
percent-encoding = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security_Credentials",
] }

[profile.release]
strip = true
lto = true
